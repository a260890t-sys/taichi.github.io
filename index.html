  #game::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(20,8,35,0.35) 0%, rgba(20,8,35,0.05) 18%, rgba(0,0,0,0) 38%, rgba(0,0,0,0.05) 70%, rgba(20,8,35,0.15) 100%);
    z-index:1; pointer-events:none;
  }

  /* --- HUD --- */
  .hud{position:absolute; top:14px; left:0; right:0; display:flex; justify-content:space-between; padding:0 14px; z-index:20;}
  .pill{
    background: linear-gradient(180deg, #7a4fc2, #5a2fa0);
    border: 3px solid #ffd76a;
    border-radius: 40px;
    padding: 6px 16px 6px 10px;
    display:flex; align-items:center; gap:8px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25), inset 0 2px 4px rgba(255,255,255,0.2);
  }
  .pill .icon{font-size:22px;}
  .pill .label{color:#ffe9a8; font-size:11px; font-weight:700; letter-spacing:1px;}
  .pill .value{color:#fff; font-size:20px; font-weight:900; letter-spacing:1px; text-shadow:0 2px 2px rgba(0,0,0,0.3);}
  .pill .col{display:flex; flex-direction:column; line-height:1.05;}

  /* --- grid of holes --- */
  .grid{
    position:absolute; left:50%; top:37%; transform:translate(-50%,0);
    width:90%; max-width:400px;
    display:grid; grid-template-columns:repeat(3,1fr); gap: 5vw 4vw;
    z-index:5;
  }
  .hole-wrap{position:relative; aspect-ratio:1/0.85; display:flex; align-items:center; justify-content:center;}
  .hole{
    position:absolute; bottom:6%; left:50%; transform:translateX(-50%);
    width:88%; height:46%;
    background: radial-gradient(ellipse at center, #2a1608 0%, #4a2a12 60%, var(--floor-dark) 100%);
    border-radius:50%;
    box-shadow: inset 0 8px 14px rgba(0,0,0,0.55), 0 3px 0 rgba(255,255,255,0.15);
  }
  .critter-slot{
    position:absolute; bottom:6%; left:50%;
    width:70%; aspect-ratio:1/1;
    transform:translate(-50%, 60%) scale(0.55);
    transform-origin: 50% 100%;
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.16s cubic-bezier(.34,1.56,.64,1), opacity 0.16s linear;
    pointer-events:none;
    filter: drop-shadow(0 6px 4px rgba(0,0,0,0.35));
    z-index:6;
    opacity:0;
  }
  .critter-slot.up{ transform:translate(-50%, -58%) scale(1); opacity:1; pointer-events:auto;}
  .critter-slot.hit{ transform:translate(-50%, 60%) scale(0.95) rotate(8deg) !important; opacity:0 !important; }
  .critter{font-size: 13vw; width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
  @media (min-width:480px){ .critter{font-size:58px;} }
  .critter img{ width:100%; height:100%; object-fit:contain; display:block; }
  .sparkle{position:absolute; font-size:11px; color:#ffe27a; animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.4; transform:scale(0.8);} 50%{opacity:1; transform:scale(1.15);}}

  .popup-score{
    position:absolute; font-weight:900; font-size:22px; pointer-events:none;
    animation: floatUp 0.7s ease-out forwards; z-index:30; text-shadow: 0 2px 4px rgba(0,0,0,0.4);
  }
  @keyframes floatUp{ from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(-50px);} }

  /* hammer cursor */
  #hammer{
    position:absolute; width:70px; height:70px; z-index:100; pointer-events:none;
    transform-origin: 80% 80%;
    transition: transform 0.08s ease-out;
    font-size:56px; text-align:center; line-height:70px;
    filter: drop-shadow(2px 4px 3px rgba(0,0,0,0.4));
    display:none;
  }
  #hammer.swing{ transform: rotate(-55deg) scale(1.05); }

  /* start / end overlays */
  .overlay{
    position:absolute; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at center, rgba(50,20,70,0.92), rgba(15,8,25,0.97));
    text-align:center; color:#fff; flex-direction:column; padding:20px;
  }
  .overlay h1{
    font-size:30px; margin:0 0 6px; color:#ffb347;
    text-shadow: 0 0 12px rgba(255,150,40,0.7), 3px 3px 0 #5a2fa0;
  }
  .overlay .sub{font-size:14px; color:#e6d6ff; margin-bottom:22px;}
  .overlay .final{font-size:44px; font-weight:900; color:#ffe27a; margin:6px 0 26px; text-shadow:0 0 10px rgba(255,220,120,0.6);}
  .btn{
    background: linear-gradient(180deg, #ff9a3d, #e0630e);
    border: 3px solid #ffd76a; color:#fff; font-weight:900; font-size:18px;
    padding: 12px 34px; border-radius:40px; cursor:pointer;
    box-shadow: 0 5px 0 #a4440a;
    letter-spacing:1px;
  }
  .btn:active{ transform: translateY(3px); box-shadow:0 2px 0 #a4440a; }
  .emoji-row{font-size:34px; margin-bottom:10px; letter-spacing:6px;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="game">
  <div class="hud">
    <div class="pill">
      <div class="icon">🎃</div>
      <div class="col"><span class="label">SCORE</span><span class="value" id="score">000000</span></div>
    </div>
    <div class="pill">
      <div class="icon">⏱️</div>
      <div class="col"><span class="label">TIME</span><span class="value" id="time">30</span></div>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div id="hammer">🔨</div>

  <div class="overlay" id="startOverlay">
    <div class="emoji-row">🎃👻🦇</div>
    <h1>ハロウィン<br>もぐらたたき</h1>
    <div class="sub">出てきたキャラをタップしてスコアを稼ごう！<br>🕷️クモには気をつけて（−点）</div>
    <button class="btn" id="startBtn">スタート</button>
  </div>

  <div class="overlay hidden" id="endOverlay">
    <h1>タイムアップ！</h1>
    <div class="sub">最終スコア</div>
    <div class="final" id="finalScore">0</div>
    <button class="btn" id="retryBtn">もういちど</button>
  </div>
</div>

<script>
(function(){
  const grid = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const hammer = document.getElementById('hammer');
  const gameEl = document.getElementById('game');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const finalScoreEl = document.getElementById('finalScore');

  const HOLES = 9;
  const GAME_TIME = 30;


  let holeEls = [];
  let holeState = []; // {up:bool, timer, critter}
  let score = 0;
  let timeLeft = GAME_TIME;
  let running = false;
  let spawnLoop, countdownLoop;

  function buildGrid(){
    grid.innerHTML = '';
    holeEls = [];
    for(let i=0;i<HOLES;i++){
      const wrap = document.createElement('div');
      wrap.className = 'hole-wrap';
      wrap.innerHTML = `
        <div class="hole"></div>
        <div class="critter-slot" data-idx="${i}">
          <span class="sparkle" style="left:-14px; top:2px;">✨</span>
          <span class="critter"></span>
          <span class="sparkle" style="right:-14px; bottom:6px;">✨</span>
        </div>`;
      grid.appendChild(wrap);
      const slot = wrap.querySelector('.critter-slot');
      slot.addEventListener('pointerdown', (e)=> whack(i, e));
      holeEls.push(slot);
    }
    holeState = Array.from({length:HOLES}, ()=>({up:false, timer:null, critter:null}));

    { emoji:'💀', pts:30, weight:1 },
    { emoji:'🕷️', pts:-15, weight:2 },
  ];

  function pickCritter(){
    const total = CRITTERS.reduce((s,c)=>s+c.weight,0);
    let r = Math.random()*total;
    for(const c of CRITTERS){ if(r<c.weight) return c; r-=c.weight; }
    return CRITTERS[0];
  }

  function popUp(i){
    if(holeState[i].up) return;
    const critter = pickCritter();
    holeState[i].up = true;
    holeState[i].critter = critter;
    const slot = holeEls[i];
    const critterEl = slot.querySelector('.critter');
    if(critter.img){
      critterEl.innerHTML = '<img src="' + critter.img + '" alt="">';
    } else {
      critterEl.innerHTML = '';
      critterEl.textContent = critter.emoji;
    }
    slot.classList.remove('hit');
    slot.classList.add('up');
    const stay = 700 + Math.random()*700;
    holeState[i].timer = setTimeout(()=> popDown(i), stay);
  }

  function popDown(i){
    if(!holeState[i].up) return;
    holeState[i].up = false;
    const slot = holeEls[i];
    slot.style.transition = 'none';
    slot.classList.remove('up');
    void slot.offsetWidth;
    slot.style.transition = '';
  }

  function whack(i, evt){
    if(!running) return;
    if(!holeState[i].up) return;
    const critter = holeState[i].critter;
    clearTimeout(holeState[i].timer);
    holeState[i].up = false;
    const slot = holeEls[i];
    slot.classList.add('hit');
    slot.classList.remove('up');

    score += critter.pts;
    if(score < 0) score = 0;
    scoreEl.textContent = String(score).padStart(6,'0');

    const rect = slot.getBoundingClientRect();
    const gameRect = gameEl.getBoundingClientRect();
    const pop = document.createElement('div');
    pop.className = 'popup-score';
    pop.textContent = (critter.pts>0? '+':'') + critter.pts;
    pop.style.color = critter.pts>0 ? '#ffe27a' : '#ff6b6b';
    pop.style.left = (rect.left - gameRect.left + rect.width/2 - 20) + 'px';
    pop.style.top = (rect.top - gameRect.top) + 'px';
    gameEl.appendChild(pop);
    setTimeout(()=> pop.remove(), 720);

    swingHammer();
    setTimeout(()=>{ slot.classList.remove('hit'); }, 200);
  }

  function swingHammer(){
    hammer.classList.add('swing');
    setTimeout(()=> hammer.classList.remove('swing'), 140);
  }

  // hammer follows pointer (mouse). On touch devices we skip visual hammer to avoid lag, but still allow swing flash near tap.
  let hasPointerMove = false;
  gameEl.addEventListener('pointermove', (e)=>{
    hasPointerMove = true;
    hammer.style.display = 'block';
    const gameRect = gameEl.getBoundingClientRect();
    hammer.style.left = (e.clientX - gameRect.left - 12) + 'px';
    hammer.style.top = (e.clientY - gameRect.top - 46) + 'px';
  });
  gameEl.addEventListener('pointerdown', (e)=>{
    hammer.style.display = 'block';
    const gameRect = gameEl.getBoundingClientRect();
    hammer.style.left = (e.clientX - gameRect.left - 12) + 'px';
    hammer.style.top = (e.clientY - gameRect.top - 46) + 'px';
    swingHammer();
  });
  gameEl.addEventListener('pointerleave', ()=>{ hammer.style.display='none'; });

  function spawnTick(){
    // choose a random empty hole to pop up, occasionally two
    const emptyIdx = holeState.map((s,i)=>s.up?-1:i).filter(i=>i>=0);
    if(emptyIdx.length===0) return;
    const n = Math.random()<0.25 ? 2 : 1;
    for(let k=0;k<n;k++){
      if(emptyIdx.length===0) break;
      const pick = emptyIdx.splice(Math.floor(Math.random()*emptyIdx.length),1)[0];
      popUp(pick);
    }
  }

  function startGame(){
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    score = 0;
    timeLeft = GAME_TIME;
    scoreEl.textContent = '000000';
    timeEl.textContent = String(timeLeft);
    buildGrid();
    running = true;

    spawnLoop = setInterval(spawnTick, 720);
    countdownLoop = setInterval(()=>{
      timeLeft--;
      timeEl.textContent = String(Math.max(timeLeft,0));
      if(timeLeft<=0) endGame();
    }, 1000);
  }

  function endGame(){
    running = false;
    clearInterval(spawnLoop);
    clearInterval(countdownLoop);
    holeState.forEach((s,i)=>{ clearTimeout(s.timer); popDown(i); });
    finalScoreEl.textContent = String(score);
    endOverlay.classList.remove('hidden');
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);

  buildGrid();
})();
</script>
